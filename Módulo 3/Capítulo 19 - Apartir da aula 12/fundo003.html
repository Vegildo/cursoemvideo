<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição dos Fundos</title>

    <style>
        
        :root {
            font-size: 62.5%; /*Transforma 1rem em 10px*/
        }
        div.bloco {
            height: 10rem;
            border: 0.1rem solid black;
            border-radius: 1rem;
            margin: 0.9rem;
            background-image: url(images/wallpaper003.jpg);
        }
        div#q1 {
            background-position: left top; /* coluna linha;*/
        }
        div#q2 {
            background-position: left center; /* coluna linha;*/
        }
        div#q3 {
            background-position: right bottom; /* coluna linha;*/
        }
        div#q4 {
            background-position: center center; /* coluna linha;*/
        }
        div#q5 {
            background-position: left bottom; /* coluna linha;*/
        }
        div#q6 {
            background-position: right top; /* coluna linha;*/
        }

    </style>

</head>
<body>

    <div class="bloco" id="q1"></div>
    <div class="bloco" id="q2"></div>
    <div class="bloco" id="q3"></div>
    <div class="bloco" id="q4"></div>
    <div class="bloco" id="q5"></div>
    <div class="bloco" id="q6"></div>

    
</body>
</html>
