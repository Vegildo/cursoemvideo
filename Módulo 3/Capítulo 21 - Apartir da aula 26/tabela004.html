<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>
        :root{
            font-size: 62.5%; /* Transformando 1rem em 10px */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.6rem;
        }
        table {
            border-collapse: collapse;
            width: 30rem;
        }
        td, th {
            border: 0.1rem solid black;
            padding: 1rem;
            text-align: center;
        }
    </style>

</head>
<body>
    
    <h1>Mesclagem de células</h1>

    <table>
        <caption>Mesclagem de células</caption>
        <thead>
            <tr>
                <th colspan="3">Letras</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>B</td>
                <td>C</td>
            </tr>
            <tr>
                <td colspan="3">D E F</td>
                <!-- <td>E</td> -->
                <!-- <td>F</td> -->
            </tr>
            <tr>
                <td colspan="2">G H</td>
                <!-- <td>H</td> -->
                <td rowspan="2">I <br> L</td>
            </tr>
            <tr>
                <td rowspan="2">J <br> M</td>
                <td>K</td>
                <!-- <td>L</td> -->
            </tr>
            <tr>
                <!-- <td>M</td> -->
                <td colspan="2">N O</td>
                <!-- <td>O</td> -->
            </tr>
            
        </tbody>
        <tfoot>

        </tfoot>
    </table>

</body>
</html>
