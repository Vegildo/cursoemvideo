<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos de Tabelas</title>

    <style>
        :root {
            font-size: 62.5%; /* Transformando 1rem em 10px */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;            
            font-size: 1.6rem;
        }

        table {
            height: 40rem;
            width: 40rem;
            border-collapse: collapse; /*Significa juntos*/
            /* border-collapse: separate; Valor padrão que significa separado */
            /* border: 0.5rem solid crimson; */
        }

        td {
            border: 0.1rem solid black;
            padding: 0.8rem;
            text-align: center; /* Alinhamento horizontal */
            vertical-align: middle; /* Alinhamento vertical */
        }

        td.num {
            text-align: right;
        }

    </style>

</head>
<body>

    <h1>Minha Primeira Tabela</h1>

    <!-- 
        Hierarquia de Tabelas Simples:

        TABLE = Tabela
            TABLE ROW = Linha de Tabela = <tr></tr>
            TABLE HEADER = Cabeçalho de Tabela
            TABLE DATA = Dado de Tabela = <td></td>
    -->
    <!-- Se a hierarquia não for obedecida, os dados vão aparecer antes ou depois da tabela. Ou seja tabelas são muito rígidas e devemos seguir fielmente a hierarquia das tags -->

    <table>        
        <tr> <!-- Primeira Linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>      
        <tr> <!-- Segunda Linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>      
        <tr> <!-- Terceira Linha -->
            <td>A3</td>
            <td>B3</td>
            <td class="num">C3</td>
        </tr>      
        <tr> <!-- Quarta Linha -->
            <td>A4</td>
            <td>B4</td>
            <td class="num">C4</td>
        </tr>
    </table>
    
</body>
</html>
