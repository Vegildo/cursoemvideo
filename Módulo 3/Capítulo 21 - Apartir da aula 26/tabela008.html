<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tabela</title>

    <style>
        :root {
            font-size: 62.5%; /*Transformando 1rem em 10px*/
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.6rem;
        }
        table {
            border-collapse: collapse;
            width: 50rem;
        }
        caption {
            font-size: 2.2rem;
            font-weight: bold;
            padding: 0.9rem;
        }
        td, th {
            border: 0.1rem solid black;
            padding: 0.9rem;
        }
        col.cname {
            background-color: chartreuse;
        }
        col.cgender {
            background-color: crimson;
        }
        col.cgrupo{
            background-color: gold;
        }
    </style>
</head>
<body>
    <h1>Exercícios de Tabela</h1>
    <table>
        <colgroup>
            <col class="cname">
            <col class="cgender">
            <col class="cage cgrupo" span="2">
            <!-- <col class="cprof"> -->
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Cláudia</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>39</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Otávio</td>
            <td>M</td>
            <td>22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
</body>
</html>
