<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios tabela</title>

    <style>
        :root {
            font-size: 62.5%; /*Transdormando 1rem em 10px*/
        }
        body {
            font-size: 1.6rem;
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 50rem;
        }
        thead, tfoot {
            background-color: darkslategray;
            color: gold;
        }
        td, th {
            border: 0.1rem solid black;
            padding: 1rem;
            text-align: center;
        }

    </style>
</head>
<body>
    <table id="ex1">
        <thead>
            <tr>
                <th colspan="4">Desafio 13 - 01</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td rowspan="2">3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
                <!-- <td></td> -->
                <td>7</td>
            </tr>
            <tr>
                <td colspan="3">8</td>
                <!-- <td>algo</td> -->
                <!-- <td>algo</td> -->
                <td>9</td>
            </tr>
            <tr>
                <td rowspan="2">10</td>
                <td colspan="2">11</td>
                <!-- <td>algo</td> -->
                <td>12</td>
            </tr>
            <tr>
                <!-- <td>algo</td> -->
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
        </tbody>
        
        <tfoot>
            <tr>
                <th colspan="4">Feito por Leonardo Braga</th>
            </tr>
        </tfoot>
    </table>
    <br><br><br><br><br>

                <td rowspan="4">C</td>

            </tr>
            <tr>

                <td colspan="4">N</td>
                <!-- <td>Algo</td> -->
                <!-- <td>Algo</td> -->

            </tr>
        </tbody>
        
        <tfoot>
            <tr>
                <th colspan="5">Feito por Leonardo Braga</th>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
