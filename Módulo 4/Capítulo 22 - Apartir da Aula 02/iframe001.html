<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos do iframe</title>

    <style>
        :root {
            font-size: 62.5%;
        }
        iframe {
            width: 40rem;
            height: 40rem;
        }
    </style>
</head>
<body>

    <h1>Testando o sso de um iframe</h1>
    <p>
        Acessando o site do <a href="https://www.cursoemvideo.com/" target="_blank">CursoemVídeo</a> para aprender a programar
    </p>
    <br><br><br>
    
    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" height="500" frameborder="0" scrolling="auto">
            <a href="https://www.cursoemvideo.com/" target="_blank">CursoemVídeo</a>
        </iframe>
        
        para aprender a programar.
    </p>

    <br><br><br>
    
    <p>
        O repositório do Guanabara 
        
        <iframe src="https://gustavoguanabara.github.io/" height="500" width="500" frameborder="0"></iframe>
        
        também é bem legal
    </p>

    <br><br><br><br><br><br><br><br><br>

    <p>
        O site do 
        <iframe src="" frameborder="0">
            <a href="https://www.google.com/">Google</a>
        </iframe>
        também é muito legal, porém tem proteção e não é possível utilizá-lo no iframe. 
    
    </p>
</body>
</html>
