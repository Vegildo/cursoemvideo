<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário</title>
</head>
<body>

    <h1>Teste de Formulário</h1>
    <form action="cadastro.js" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais:</legend>
            <div>
            
                <label for="imail">Email: </label>
                <input type="email" name="mail" id="imail" required placeholder="Email Cadastro" autocomplete="email">
                <!-- RegEx: https://regex101.com/ -->
            </div>
            <div>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" required placeholder="(xx)xxxx-xxxx" autocomplete="tel" pattern="^\(\d{2}\)9[0-9]{3}\-[0-9]{4}$">
            
            </div>
            <div>
            
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </fieldset>

    </form>
    
</body>
</html>
