<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários Outnput</title>
</head>
<body>
    <h1>Formulários Output</h1>
    <form action="cadastro.js" method="post">
        <div>
            <label for="in1">Número 1: </label>
            <br>
            <input type="number" id="in1" name="n1" min="0" max="30" required oninput="isum.innerHTML = Number(in1.value) + Number(in2.value)">
        </div>
        <br>
        <div>
            <label for="in2">Número 2: </label>
            <br>
            <input type="number" id="in2" name="n2" min="0" max="30" required oninput="isum.innerHTML = Number(in1.value) + Number(in2.value)">
        </div>
        <br>
        <div>
            <label for="isum">Soma: </label>
            <output name="sum" id="isum">0</output>
        </div>
        <br>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    
</body>
</html>
