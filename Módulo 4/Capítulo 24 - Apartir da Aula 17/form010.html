<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon-vaduz.png" type="image/x-icon">
    <title>Formulários Outnput</title>
</head>
<body>
    <h1>Formulários Output</h1>
    <form action="cadastro.js" method="post">
        <div>
            <label for="iyear">Em que ano você nasceu? </label>
            <input type="number" name="year" id="iyear" min="1900" max="2024" oninput="iage.innerHTML = calcAge(iyear.value)">
        </div>
        <br>
        <div>
            <label for="iage">Sua idade é: </label>
            <output name="age" id="iage">0</output>
        </div>
        <br>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>

    <script>
        function calcAge(year) {
            let actualYear = new Date().getFullYear()
            return Number(actualYear - year);
        }
    </script>
    
</body>
</html>
