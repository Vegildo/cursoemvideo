<!DOCTYPE html>
<html lang="pt-br  ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Formulários</title>
</head>
<body>
    <h1>Mais Exemplos de Formulários</h1>
     <form action="cadastro.js" method="post">
        <div>
            <label for="icolor">Cor: </label>
            <input type="color" name="color" id="icolor" value="#00ff00">
        </div>
        <div>
            <label for="irange">Nível de satisfação: </label>
            <input type="range" name="range" id="irange" min="1" max="5" value="2">
            <!-- O range é de 0 a 10 por default -->
        </div>
        <div>
            <label for="photo">Foto de Perfil: </label>
            <input type="file" name="photo" id="iphoto">
            <!-- Quando utilizamos o input file, precisamos de um form com o método post-->
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>

     </form>
</body>
</html>
